<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pepe</title>
<script>
  // Single Page Apps for GitHub Pages: redirects a 404 (any real path like
  // /library or /pack/foo, which don't exist as files) back to index.html
  // with the intended path encoded in the query string, so index.html's
  // own script can restore it via history.replaceState without a real reload.
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
