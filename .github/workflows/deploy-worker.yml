name: Deploy uploads worker

# Deploys worker/ (community uploads + AI reviewer) to Cloudflare.
# Needs repo secrets:
#   CLOUDFLARE_API_TOKEN  - with Workers Scripts, D1 and R2 edit access
#   GEMINI_API_KEY        - Google AI Studio key for the AI reviewer
#   TOKEN_KEY             - long random string that encrypts creators' LootLabs tokens
# Uses the existing D1 database pepes-portfolio-db (id in worker/wrangler.toml)
# and creates the R2 bucket pepes-portfolio-uploads on the first run.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 813b5cffc96f7f5095968d2a00e3eb28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # Creates the R2 bucket if it doesn't exist yet. Errors if it already
      # exists, which is fine on re-runs. The D1 database is pepes-portfolio-db,
      # set in wrangler.toml, so nothing is created for D1.
      - name: Ensure R2 bucket exists
        run: npx wrangler r2 bucket create pepes-portfolio-uploads || echo "R2 bucket not created (probably already exists)"

      # CREATE TABLE IF NOT EXISTS, so re-running it is safe. Only adds the
      # uploads tables to pepes-portfolio-db; existing tables are not touched.
      - name: Apply database schema
        run: npx wrangler d1 execute pepes-portfolio-db --remote --file=schema.sql

      - name: Deploy
        run: npx wrangler deploy

      - name: Set Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is empty; the AI reviewer stays off."
            exit 0
          fi
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      # Encrypts creators' LootLabs tokens. Set it once and never change it:
      # changing it makes saved tokens unreadable.
      - name: Set token key
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          if [ -z "$TOKEN_KEY" ]; then
            echo "TOKEN_KEY secret is empty; creators can't save LootLabs tokens yet."
            exit 0
          fi
          printf '%s' "$TOKEN_KEY" | npx wrangler secret put TOKEN_KEY
