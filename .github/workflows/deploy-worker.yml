name: Deploy uploads worker

# Deploys worker/ (community uploads + AI reviewer) to Cloudflare.
# Needs repo secrets:
#   CLOUDFLARE_API_TOKEN  - with Workers Scripts, D1 and R2 edit access
#   GEMINI_API_KEY        - Google AI Studio key for the AI reviewer
#   TOKEN_KEY             - long random string that encrypts creators' LootLabs tokens
# Before the first run: create the D1 database and R2 bucket and put the
# database_id in worker/wrangler.toml (see README "Community Uploads").

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 813b5cffc96f7f5095968d2a00e3eb28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # Creates the D1 database and R2 bucket if they don't exist yet, then
      # writes the database ID into wrangler.toml for this run only (the file
      # in git keeps the placeholder). Safe to re-run.
      - name: Provision D1 database and R2 bucket
        run: |
          set -euo pipefail
          DB=pepes-portfolio-uploads
          ID=$(npx wrangler d1 list --json | jq -r --arg n "$DB" '.[] | select(.name == $n) | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create "$DB"
            ID=$(npx wrangler d1 list --json | jq -r --arg n "$DB" '.[] | select(.name == $n) | .uuid')
          fi
          if [ -z "$ID" ]; then
            echo "Could not find or create D1 database $DB" >&2
            exit 1
          fi
          echo "D1 database $DB id: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          # Errors if the bucket already exists; that is fine on re-runs.
          npx wrangler r2 bucket create "$DB" || echo "R2 bucket $DB not created (probably already exists)"

      # CREATE TABLE IF NOT EXISTS, so re-running it is safe.
      - name: Apply database schema
        run: npx wrangler d1 execute pepes-portfolio-uploads --remote --file=schema.sql

      - name: Deploy
        run: npx wrangler deploy

      - name: Set Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is empty; the AI reviewer stays off."
            exit 0
          fi
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      # Encrypts creators' LootLabs tokens. Set it once and never change it:
      # changing it makes saved tokens unreadable.
      - name: Set token key
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          if [ -z "$TOKEN_KEY" ]; then
            echo "TOKEN_KEY secret is empty; creators can't save LootLabs tokens yet."
            exit 0
          fi
          printf '%s' "$TOKEN_KEY" | npx wrangler secret put TOKEN_KEY
