name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore LootLabs link cache
        uses: actions/cache@v4
        with:
          path: lootlabs_cache.json
          key: lootlabs-cache-${{ github.run_id }}
          restore-keys: |
            lootlabs-cache-

      - name: Generate packs.json
        env:
          LOOTLABS_API_TOKEN: ${{ secrets.LOOTLABS_API_TOKEN }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python generator.py

      - name: Prepare site output
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='_site' --exclude='node_modules' --exclude='*.py' \
            --exclude='lootlabs_cache.json' --exclude='.gitignore' \
            --exclude='README.md' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
