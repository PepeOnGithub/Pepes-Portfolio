name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Create LFS file list for cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        # A no-op for any object the cache above already restored - only
        # objects that actually changed since the last successful build get
        # downloaded, instead of re-pulling the full ~175MB every run.
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore LootLabs link cache
        uses: actions/cache@v4
        with:
          path: lootlabs_cache.json
          key: lootlabs-cache-${{ github.run_id }}
          restore-keys: |
            lootlabs-cache-

      - name: Generate packs.json
        env:
          LOOTLABS_API_TOKEN: ${{ secrets.LOOTLABS_API_TOKEN }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python generator.py

      - name: Prepare site output
        run: |
          mkdir -p _site
          # .mcpack/.mcaddon are Git LFS-tracked and served straight from
          # GitHub's LFS media endpoint (see generator.py's to_download_url) -
          # GitHub Pages can't serve LFS content correctly anyway, so they're
          # left out of the deploy artifact entirely.
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='_site' --exclude='node_modules' --exclude='*.py' \
            --exclude='lootlabs_cache.json' --exclude='.gitignore' \
            --exclude='.gitattributes' --exclude='README.md' \
            --exclude='*.mcpack' --exclude='*.mcaddon' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        # The custom domain sits behind Cloudflare, which caches script.js/
        # styles.css/etc. for hours - without this, a deploy can finish
        # successfully on GitHub's side while visitors still get the old
        # files for up to Cache-Control's max-age. Requires CLOUDFLARE_ZONE_ID
        # and CLOUDFLARE_API_TOKEN (Zone -> Cache Purge permission) repo
        # secrets; silently skipped if either isn't set.
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CLOUDFLARE_ZONE_ID/CLOUDFLARE_API_TOKEN not set - skipping cache purge."
            exit 0
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "$body"
          if [ "$status" -ge 300 ] || ! echo "$body" | grep -q '"success":true'; then
            echo "::warning::Cloudflare cache purge failed (HTTP $status)"
          fi
