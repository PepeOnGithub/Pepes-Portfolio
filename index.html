<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal pack library - browse, search, and download design packs">
  <meta property="og:title" content="Pack Library" />
  <meta property="og:description" content="Personal collection of design packs and resources" />
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#489c49">
  <title>Pack Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Header -->
  <header class="site-header">
    <div class="header-content">
      <div class="header-branding">
        <div class="header-logo">
          <i class="fas fa-cube"></i>
        </div>
        <div class="header-text">
          <h1 class="header-title">Pack Library</h1>
          <p class="header-subtitle">Personal Design Collection</p>
        </div>
      </div>
      <nav class="header-nav">
        <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" id="settings-toggle" title="Settings" aria-label="Settings">
          <i class="fas fa-cog"></i>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="main-container">

    <!-- Search & Filter -->
    <div class="search-section">
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search packs by name, tag, or description..."
          aria-label="Search packs"
        >
        <button class="search-clear" id="search-clear" aria-label="Clear search" style="display: none;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="filter-section">
        <div class="filter-group">
          <label for="category-filter" class="filter-label">Category:</label>
          <select id="category-filter" class="filter-select">
            <option value="">All Categories</option>
            <option value="templates">Templates</option>
            <option value="designs">Designs</option>
            <option value="resources">Resources</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="sort-filter" class="filter-label">Sort:</label>
          <select id="sort-filter" class="filter-select">
            <option value="name">Name (A-Z)</option>
            <option value="recent">Recently Added</option>
            <option value="popular">Most Downloaded</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Results Info -->
    <div class="results-info">
      <p id="results-text">Loading packs...</p>
    </div>

    <!-- Packs Grid -->
    <div id="packs-grid" class="packs-grid">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Indexing pack library...</p>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <i class="fas fa-box-open"></i>
      <h2>No Packs Found</h2>
      <p>Try adjusting your search or filters</p>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" aria-label="Close settings">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label class="setting-label">
            <input type="checkbox" id="dark-mode-toggle" class="setting-input">
            <span>Dark Mode</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="setting-label">
            <input type="checkbox" id="compact-view-toggle" class="setting-input">
            <span>Compact View</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 Pack Library. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
